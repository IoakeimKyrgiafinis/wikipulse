# Dependabot (spec 09c): weekly pull requests that update dependencies. Every such pull
# request runs the whole CI pipeline (tests, the detection eval gate, the smoke test), so
# an update that breaks something shows up as a red check before anyone merges it.
#
# Minor and patch updates of each ecosystem come grouped in one pull request a week;
# major updates come one by one, because they are the ones that need reading.
# Security updates (Dependabot alerts) are separate and arrive as soon as they are known.
#
# Not covered on purpose:
# - docker/airflow/requirements-*.txt: they are generated from uv.lock, and a test checks
#   that they match it. Dependabot updating them on their own would only break that test.
# - The service images in docker-compose.yml and in the CI jobs (redis, postgres, neo4j,
#   rustfs): they are pinned to what the code was tested against; update them by hand,
#   in both places at once.
version: 2
updates:
  # Python packages: pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # The actions the workflows use (actions/checkout, astral-sh/setup-uv, ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [major, minor, patch]
    commit-message:
      prefix: ci

  # Base images of the three images the release builds.
  - package-ecosystem: docker
    directories:
      - /
      - /docker/airflow
      - /docker/mlflow
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # Terraform providers (the lock files in infra/storage and infra/cluster).
  - package-ecosystem: terraform
    directories:
      - /infra/storage
      - /infra/cluster
    schedule:
      interval: weekly
      day: monday
    groups:
      terraform-providers:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

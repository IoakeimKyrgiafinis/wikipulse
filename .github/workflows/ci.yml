name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Redis and Postgres for the integration tests (`pytest -m integration`), same
      # images as Compose.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wikipulse
          POSTGRES_PASSWORD: wikipulse
          POSTGRES_DB: wikipulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wikipulse -d wikipulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_DSN: postgresql://wikipulse:wikipulse@localhost:5432/wikipulse
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv (with download cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run unit tests
        run: uv run pytest

      - name: Apply database migrations
        run: uv run python -m wikipulse.db.migrate

      - name: Run integration tests
        run: uv run pytest -m integration

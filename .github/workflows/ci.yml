name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Redis, Postgres, Neo4j and RustFS (S3) for the integration tests
      # (`pytest -m integration`), same images as Compose.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wikipulse
          POSTGRES_PASSWORD: wikipulse
          POSTGRES_DB: wikipulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wikipulse -d wikipulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/wikipulse-graph
          NEO4J_server_memory_heap_max__size: 1g
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p wikipulse-graph 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s
      # S3-compatible object storage for the data lake tests (same image as Compose).
      rustfs:
        image: rustfs/rustfs:1.0.4
        env:
          RUSTFS_ACCESS_KEY: wikipulse
          RUSTFS_SECRET_KEY: wikipulse-lake
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fs http://localhost:9000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      REDIS_URL: redis://localhost:6379/0
      POSTGRES_DSN: postgresql://wikipulse:wikipulse@localhost:5432/wikipulse
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: wikipulse-graph
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: wikipulse
      S3_SECRET_KEY: wikipulse-lake
      # Redis as RustFS reaches it for lake notifications (spec 06b): service containers
      # share a network on which each one's hostname is its service name.
      LAKE_NOTIFY_REDIS_URL: redis://redis:6379/0
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv (with download cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run unit tests
        run: uv run pytest

      - name: Apply database migrations
        run: uv run python -m wikipulse.db.migrate

      - name: Run integration tests
        run: uv run pytest -m integration

[project]
name = "wikipulse"
version = "0.1.0"
description = "Detects breaking news from Wikipedia's live edit stream and answers questions about it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    # Stage 3 (spec 03b): summary embeddings for event grouping. torch is listed
    # directly only so that it comes from the CPU-only index below.
    "sentence-transformers>=3.3",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.40.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

# CPU-only PyTorch builds: the Linux wheels on PyPI pull in several GB of CUDA libraries
# that WikiPulse doesn't use (CI runs on Linux). Windows wheels are the same either way.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikipulse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Integration and live tests are skipped by default. A later `-m` on the command line
# overrides this one, e.g. `uv run pytest -m integration`.
addopts = "-m 'not integration and not live'"
markers = [
    "integration: needs the Docker services (Redis, Postgres) running",
    "live: touches the real Wikimedia services over the network",
]

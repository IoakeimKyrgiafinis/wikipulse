[project]
name = "wikipulse"
version = "0.1.0"
description = "Detects breaking news from Wikipedia's live edit stream and answers questions about it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    # Stage 3 (spec 03b): summary embeddings for event grouping. torch is listed
    # directly only so that it comes from the CPU-only index below.
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "ollama>=0.6",
    "neo4j>=5.26",
    # Stage 5 (spec 05c): the official MCP Python SDK (2.x API: mcp.server.mcpserver.MCPServer).
    "mcp>=2.3",
    # Stage 5 (spec 05e): the web API and page. uvicorn serves it; websockets is the
    # library uvicorn speaks WebSocket with (uvicorn alone has none).
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
    # Stage 6 (spec 06a): the data lake. pyarrow writes Parquet and talks S3 (its own
    # S3 filesystem, so no boto3); DuckDB runs SQL over the archive.
    "pyarrow>=26",
    "duckdb>=2.0",
    # Stage 7 (spec 07b): experiment tracking and the model registry (the client; the
    # server runs in Docker Compose), the classic models and the plots of the evaluation.
    "mlflow>=3.18",
    "scikit-learn>=1.9",
    "matplotlib>=3.11",
    # Stage 9 (spec 09a): every service exposes Prometheus metrics on /metrics.
    "prometheus-client>=0.21",
    "langfuse>=3",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.40.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

# CPU-only PyTorch builds: the Linux wheels on PyPI pull in several GB of CUDA libraries
# that WikiPulse doesn't use (CI runs on Linux). Windows wheels are the same either way.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikipulse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Integration and live tests are skipped by default. A later `-m` on the command line
# overrides this one, e.g. `uv run pytest -m integration`.
addopts = "-m 'not integration and not live'"
markers = [
    "integration: needs the Docker services (Redis, Postgres, Neo4j, RustFS) running",
    "live: touches real outside services (Wikimedia over the network, or the local Ollama)",
]

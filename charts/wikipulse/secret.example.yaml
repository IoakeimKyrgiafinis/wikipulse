# TEMPLATE ONLY: never put real values in this file or commit a filled-in copy.
#
# The chart doesn't create this Secret (a chart in git must not hold secrets); its pods
# read it by name (existingSecret in values.yaml). It is not part of the packaged chart
# (.helmignore).
#
# `uv run python scripts/cluster.py secret` (or `up`) creates the real Secret from your settings
# (.env and the defaults in wikipulse/config.py), without writing it to disk:
#   POSTGRES_DSN    the Postgres DSN of POSTGRES_DSN, with the host replaced by `postgres`
#   NEO4J_PASSWORD, S3_ACCESS_KEY, S3_SECRET_KEY
#   USER_AGENT      Wikimedia requires a contact address; it is personal, so it lives here
#
# To create it by hand instead, fill in a copy outside the repository and run
#   kubectl apply -f <your copy>
# Values under stringData are plain text; Kubernetes stores them base64-encoded.
apiVersion: v1
kind: Secret
metadata:
  name: wikipulse-secrets
  namespace: wikipulse
  labels: {app.kubernetes.io/part-of: wikipulse}
type: Opaque
stringData:
  POSTGRES_DSN: postgresql://<user>:<password>@postgres:5432/<database>
  NEO4J_PASSWORD: <neo4j password>
  S3_ACCESS_KEY: <access key>
  S3_SECRET_KEY: <secret key>
  USER_AGENT: WikiPulse/0.1 (https://github.com/<you>/wikipulse; <your email>)

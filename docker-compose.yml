# Local services for WikiPulse. Start with `docker compose up -d`.
# Credentials come from .env (copy .env.example to .env first).
services:
  redis:
    image: redis:7-alpine
    # Append-only file: every write is logged to disk, so data survives restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wikipulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wikipulse}
      POSTGRES_DB: ${POSTGRES_DB:-wikipulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes Compose interpolation, so the variables are read inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:

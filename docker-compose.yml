# Local services for WikiPulse. Start with `docker compose up -d`.
# Credentials come from .env (copy .env.example to .env first).
services:
  redis:
    image: redis:7-alpine
    # Append-only file: every write is logged to disk, so data survives restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wikipulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wikipulse}
      POSTGRES_DB: ${POSTGRES_DB:-wikipulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes Compose interpolation, so the variables are read inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  neo4j:
    # Knowledge graph (stage 4). Neo4j Browser: http://localhost:7474 (user neo4j).
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-wikipulse-graph}
      # For the health check below. (Variables named NEO4J_* are read as Neo4j settings.)
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:-wikipulse-graph}
      # Modest memory, so Neo4j fits next to Ollama and the other services.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      # $$ escapes Compose interpolation, so the variable is read inside the container.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${HEALTHCHECK_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  neo4j-eval:
    # A frozen copy of the knowledge graph for evaluations (spec 05b). Neo4j Community
    # has one user database per server, so the "separate database" is a second server
    # with its own volume. Filled by `uv run python scripts/snapshot_graph.py restore`;
    # only started with the "eval" profile (`docker compose --profile eval up -d`).
    image: neo4j:5-community
    profiles: ["eval"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-wikipulse-graph}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:-wikipulse-graph}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "${NEO4J_EVAL_HTTP_PORT:-7475}:7474"
      - "${NEO4J_EVAL_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4j-eval-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${HEALTHCHECK_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  rustfs:
    # S3-compatible object storage for the data lake (stage 6, spec 06a). MinIO's free
    # edition no longer ships container images, so this is RustFS, an Apache-2.0,
    # MinIO-compatible server. Any S3 store works: the code only knows S3_ENDPOINT.
    # Web console: http://localhost:9001 (S3_ACCESS_KEY / S3_SECRET_KEY).
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-wikipulse}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-wikipulse-lake}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  airflow:
    # Scheduled batch jobs (stage 6, spec 06c): Airflow in one container
    # (`airflow standalone`: scheduler, DAG processor, triggerer and the web UI/API,
    # with the LocalExecutor). Its metadata lives in its own database (AIRFLOW_DB) of
    # the postgres service. Only started with the "airflow" profile:
    #   docker compose --profile airflow up -d      then http://localhost:8080
    # The repository is mounted at /opt/wikipulse: the DAGs are read from dags/, the
    # tasks run `wikipulse.jobs` from there (with .env), and write into data/.
    build: docker/airflow
    image: wikipulse-airflow:3.3.2
    profiles: ["airflow"]
    command: ["python", "/opt/wikipulse/docker/airflow/start.py"]
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-wikipulse}:${POSTGRES_PASSWORD:-wikipulse}@postgres:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/wikipulse/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
      # Lean: at most 2 tasks at once, one API worker, new DAG files seen within 30 s.
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      # Local development: everyone is admin, no login form (the port is loopback only).
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-wikipulse-local-dev-only-change-me}
      # The tasks' WikiPulse settings: like .env, but with the services' names in Docker.
      WIKIPULSE_HOME: /opt/wikipulse
      WIKIPULSE_PYTHON: /opt/wikipulse-venv/bin/python
      WIKIPULSE_ML_PYTHON: /opt/wikipulse-ml-venv/bin/python
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-wikipulse}:${POSTGRES_PASSWORD:-wikipulse}@postgres:5432/${POSTGRES_DB:-wikipulse}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://rustfs:9000
      DATA_DIR: /opt/wikipulse/data
      # The retraining DAG (spec 07c): the MLflow service by its name, and the embedding
      # model downloaded once into data/ (not into the container, where it would be lost).
      MLFLOW_TRACKING_URI: http://mlflow:5000
      HF_HOME: /opt/wikipulse/data/cache/huggingface
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - .:/opt/wikipulse
      - airflow-logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  mlflow:
    # Experiment tracking and the model registry (stage 7, spec 07b). Metadata in its own
    # database (MLFLOW_DB, default `mlflow`) of the postgres service, artifacts (models,
    # plots) in their own bucket (MLFLOW_BUCKET) of the rustfs service; both created on
    # first start. Clients upload artifacts through the server, so they need no S3
    # credentials. Only started with the "mlflow" profile:
    #   docker compose --profile mlflow up -d      then http://localhost:5000
    build: docker/mlflow
    image: wikipulse-mlflow:3.18.0
    profiles: ["mlflow"]
    environment:
      MLFLOW_POSTGRES_DSN: postgresql://${POSTGRES_USER:-wikipulse}:${POSTGRES_PASSWORD:-wikipulse}@postgres:5432
      MLFLOW_DB: ${MLFLOW_DB:-mlflow}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-wikipulse-mlflow}
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-wikipulse}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-wikipulse-lake}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      # Lean: no background job runner. It serves GenAI features WikiPulse doesn't use
      # (online trace scoring, trace archival) and starts ~9 processes of ~250 MB each.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      # Host headers it answers: this machine's published port, and the service name for
      # other containers (Airflow's retraining tasks, spec 07c).
      MLFLOW_ALLOWED_HOSTS: localhost:${MLFLOW_PORT:-5000},127.0.0.1:${MLFLOW_PORT:-5000},mlflow:5000
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  neo4j-data:
  neo4j-eval-data:
  rustfs-data:
  airflow-logs:

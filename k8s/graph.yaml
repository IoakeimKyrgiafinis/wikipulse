# Knowledge graph (stage 4): extracts entities and relations of new events with the LLM
# (Ollama on the host, through the `ollama` Service) and stores them in Neo4j. Events
# that fail are retried later; a restart picks up the events not yet extracted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graph
  namespace: wikipulse
  labels:
    app.kubernetes.io/name: graph
    app.kubernetes.io/part-of: wikipulse
spec:
  replicas: 1
  # One replica, replaced with Recreate (the old pod stops before the new one starts):
  # two at once would process the same work twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: graph
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graph
        app.kubernetes.io/part-of: wikipulse
    spec:
      automountServiceAccountToken: false
      # No "service links": Kubernetes would otherwise set variables such as
      # API_PORT=tcp://10.96.0.12:8000 for every Service, and API_PORT is a WikiPulse setting.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # SIGTERM: it stops after the event in hand (one LLM call can take up to 120 s).
      terminationGracePeriodSeconds: 150
      containers:
        - name: graph
          image: wikipulse:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "wikipulse.graph.run"]
          envFrom:
            - configMapRef: {name: wikipulse-config}
            - secretRef: {name: wikipulse-secrets}
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # It beats once per poll and after every event; an event can take minutes.
          startupProbe:
            exec:
              command: ["python", "-m", "wikipulse.health", "--max-age", "300"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["python", "-m", "wikipulse.health", "--max-age", "300"]
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "-m", "wikipulse.health", "--max-age", "900"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}

# Applies the Postgres migrations (wikipulse/db/migrations) once, before the services
# start. A Job runs a pod to completion instead of keeping it running. It is not in
# kustomization.yaml: a finished Job can't be changed, so scripts/cluster.py deletes the
# old one, applies this file with the current image and waits for it to complete.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: wikipulse
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: wikipulse
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: wikipulse
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # No "service links": Kubernetes would otherwise set variables such as
      # API_PORT=tcp://10.96.0.12:8000 for every Service, and API_PORT is a WikiPulse setting.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: wikipulse:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "wikipulse.db.migrate"]
          envFrom:
            - configMapRef: {name: wikipulse-config}
            - secretRef: {name: wikipulse-secrets}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

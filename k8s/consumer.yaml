# The live stream consumer (stage 1): Wikimedia's recentchange stream -> Redis Stream
# `wiki:edits`. Exactly one replica, ever: Wikimedia asks for one stream connection per
# client, and two consumers would write every edit twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: wikipulse
  labels:
    app.kubernetes.io/name: consumer
    app.kubernetes.io/part-of: wikipulse
spec:
  replicas: 1
  # Recreate: stop the old pod before starting the new one on every change, so there are
  # never two connections (a RollingUpdate would start the new pod first).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consumer
        app.kubernetes.io/part-of: wikipulse
    spec:
      automountServiceAccountToken: false  # it never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # SIGTERM first: the consumer finishes the message in hand and stops cleanly. The
      # checkpoint in Redis makes even a hard kill safe; this just keeps logs tidy.
      terminationGracePeriodSeconds: 30
      containers:
        - name: consumer
          image: wikipulse:dev
          imagePullPolicy: IfNotPresent  # the image is loaded into kind, not pulled
          # Its own checkpoint namespace (wiki:k8s:consumer:*): the cluster starts from
          # "now" instead of resuming a laptop consumer's old checkpoint. It still writes
          # the shared stream wiki:edits that the detector and the archiver read.
          command: ["python", "-m", "wikipulse.stream.consume", "--namespace", "wiki:k8s:consumer"]
          envFrom:
            - configMapRef: {name: wikipulse-config}
            - secretRef: {name: wikipulse-secrets}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The consumer beats after every message and every connection attempt.
          startupProbe:
            exec:
              command: ["python", "-m", "wikipulse.health", "--max-age", "120"]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["python", "-m", "wikipulse.health", "--max-age", "120"]
            periodSeconds: 15
            timeoutSeconds: 10
          # Liveness allows for the longest reconnect backoff (RECONNECT_MAX_S = 60 s):
          # only a consumer stuck for minutes is restarted.
          livenessProbe:
            exec:
              command: ["python", "-m", "wikipulse.health", "--max-age", "300"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}

# A PersistentVolumeClaim for the embedding model (EVENTS_EMBED_MODEL, about 130 MB),
# shared by the grouper and the API. The model is downloaded from Hugging Face on the
# first start and survives pod restarts and image rebuilds, so it is neither baked into
# the image nor fetched again. kind's default StorageClass (local-path) creates the
# volume as a directory on the node; ReadWriteOnce means "one node", and kind has one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: wikipulse
  labels: {app.kubernetes.io/part-of: wikipulse}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

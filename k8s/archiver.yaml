# Data lake archiver (stage 6): reads `wiki:edits` with its own consumer group
# (`lake:archive`), writes hourly Parquet files to S3, then acknowledges. A Redis lock
# allows one archiver per lake; after a hard kill the next pod waits until the lock
# expires (LAKE_LOCK_TTL_S, 60 s) and re-reads what was never acknowledged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archiver
  namespace: wikipulse
  labels:
    app.kubernetes.io/name: archiver
    app.kubernetes.io/part-of: wikipulse
spec:
  replicas: 1
  # One replica, replaced with Recreate (the old pod stops before the new one starts):
  # two at once would process the same work twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: archiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: archiver
        app.kubernetes.io/part-of: wikipulse
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # SIGTERM: it writes what it has buffered before exiting.
      terminationGracePeriodSeconds: 90
      containers:
        - name: archiver
          image: wikipulse:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "wikipulse.lake.archive"]
          envFrom:
            - configMapRef: {name: wikipulse-config}
            - secretRef: {name: wikipulse-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # It beats every time it checks whether to stop, also while it waits for the lock.
          startupProbe:
            exec:
              command: ["python", "-m", "wikipulse.health", "--max-age", "120"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["python", "-m", "wikipulse.health", "--max-age", "120"]
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "-m", "wikipulse.health", "--max-age", "300"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}

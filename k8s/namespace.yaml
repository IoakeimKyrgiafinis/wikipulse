# Everything WikiPulse runs in the cluster lives in this namespace, so one
# `kubectl delete namespace wikipulse` removes it all (and network policies apply to it).
apiVersion: v1
kind: Namespace
metadata:
  name: wikipulse
  labels:
    app.kubernetes.io/part-of: wikipulse
    # Pod Security Admission: refuse pods that run as root, add capabilities, ...
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
